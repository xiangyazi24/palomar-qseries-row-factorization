automation:
  methods:
    - method: agent
      models: ["OpenAI Codex", "Claude Opus", "ChatGPT"]
      framework: "Lean 4 with remote builds and independent statement review"
      tool_setup: >-
        AI-assisted proof development, exact statement comparison, dependency
        extraction, clean Linux builds, and transitive axiom inspection under
        human direction.
      cost:
        wall_time: "not reconstructed"
        spend_usd: "subscription-based"
        hardware: "Mac mini orchestration and uisai2 Linux verification"
      prompting_notes: >-
        Agents proposed, implemented, and reviewed proof steps. Every retained
        Solution declaration is checked by Lean, selected by Comparator, and
        independently inspected through permanent #print axioms commands.
  spend_usd: "subscription-based"
  notes: >-
    The submission record retains only claims supported by the pinned public
    source, Comparator, and the attached manuscript.

fidelity:
  divergences: >-
    The formalization proves the explicit convergent completed theta and its
    transformation and differential formulas. It does not assert uniqueness or
    canonicity among all possible completions, does not construct a closed
    vector-valued representation, and does not identify the paper's row model
    with an older Chan-project source object. The paper states the same limits.

review:
  status: "agent-reviewed"
  reviewers:
    - "OpenAI Codex (Sol max)"
  notes: >-
    The independent Sol max audit passed the mathematical and manuscript
    alignment after two publication-infrastructure repairs. A separately
    requested cold Fable review remains pending because the provider's weekly
    quota is unavailable until 2026-08-28.

alignment:
  namespace: "PalomarQseriesRowFactorization"
  statements:
    - source: "Paper, Theorem 5.7: coefficientwise row-model factorization"
      lean: "PalomarQseriesRowFactorization.mk_factorization"
      module: "Challenge"
      status: proved
      note: >-
        Together with the next two declarations, this gives the finite
        coefficient identity assembled internally into the Laurent-series
        factorization.
    - source: "Paper, row-model even-level identification"
      lean: "PalomarQseriesRowFactorization.coneDiffH_two_mul"
      module: "Challenge"
      status: proved
      note: "Every even row level is the manuscript coefficient."
    - source: "Paper, row-model odd-level vanishing"
      lean: "PalomarQseriesRowFactorization.coneDiffH_odd"
      module: "Challenge"
      status: proved
      note: "Every odd row level vanishes."
    - source: "Paper, Theorem 1.1 and equation (5): exact completion and holomorphic sign part"
      lean: "PalomarQseriesRowFactorization.exact_completion_bridge"
      module: "Challenge"
      status: proved
      note: "Identifies the holomorphic sign part with q^(1/10) B(q)."
    - source: "Zwegers, Lemma 2.8 specialized to the paper's quadratic data"
      lean: "PalomarQseriesRowFactorization.zwegers_lemma28"
      module: "Challenge"
      status: proved
      note: "Includes the exact transform constant and negative inverse exponential."
    - source: "Paper, equation (6): T transformation"
      lean: "PalomarQseriesRowFactorization.completedTheta_add_one"
      module: "Challenge"
      status: proved
      note: "The upper-half-plane condition is the only binder beyond tau."
    - source: "Paper, Theorem 1.1 and equation (7): S transformation and two-component reduction"
      lean: "PalomarQseriesRowFactorization.completedTheta_S"
      module: "Challenge"
      status: proved
      note: "States both the five-term formula and its algebraic two-term form."
    - source: "Paper, Proposition 7.3: exact boundary derivative and xi image"
      lean: "PalomarQseriesRowFactorization.exact_differential_image"
      module: "Challenge"
      status: proved
      note: "Both mixed unary-theta expressions are registered in one conjunction."
    - source: "Paper, Theorem 1.1: nonzero differential image and nonharmonicity"
      lean: "PalomarQseriesRowFactorization.completedTheta_not_harmonic"
      module: "Challenge"
      status: proved
      note: "Uses the explicit point 2i to refute the weight-one harmonicity equation."

acknowledgements: >-
  Mathlib and Lean provide the formal foundation. Zwegers' thesis supplies the
  general indefinite-theta framework, and Chan's q-series work supplies the
  motivating dissection context.
