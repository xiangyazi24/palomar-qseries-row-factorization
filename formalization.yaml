# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "A shifted indefinite theta completion over Q(sqrt(5))"
  description: >-
    A Lean 4 verification of an explicit rank-two indefinite theta completion
    over Q(sqrt(5)). The registered results cover the coefficientwise row-model
    factorization; the exact holomorphic-sign-part bridge; a specialization of
    Zwegers' Lemma 2.8; the weight-one T and S transformations, including the
    five-to-two characteristic reduction; the exact mixed boundary derivative
    and Bruinier--Funke image; and a kernel-checked nonharmonicity witness.
  authors:
    - "Xiang Huang"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Xiang Huang"

classification:
  arxiv: [math.NT]
  msc2020: [11F27, 33D15]

sources:
  - title: "A shifted indefinite theta completion over Q(sqrt(5)): an asymmetric boundary derivative and a row-model factorization"
    authors:
      - "Xiang Huang"
    type: original-proof
    location: "paper/paper2.pdf"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The paper and formalization were developed together. Comparator covers
      the paper's row-model factorization, completed-theta bridge, Lemma 2.8
      specialization, T and S transformations, exact differential images, and
      nonharmonicity conclusion.
  - title: "Mock theta functions"
    authors:
      - "Sander Zwegers"
    type: thesis
    location: "Utrecht University, 2002, Definition 2.1, Lemma 2.8, and Corollary 2.9"
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      The analytic part specializes the rank-two indefinite-theta kernel and
      proves the Fourier-transform and transformation identities needed for
      the manuscript's exact characteristics.
  - title: "Ramanujan's cubic continued fraction and an analog of his most beautiful identity"
    authors:
      - "Hei-Chi Chan"
    id: "doi:10.1142/S1793042110003150"
    type: paper
    location: "International Journal of Number Theory 6 (2010), 673-680"
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Chan's tenth-order dissection motivates the paper's row model. The
      registered result does not claim a source-to-model identification with
      an older project object.

related_formalizations:
  - id: "xiangyazi24/Q-series-and-Chan-s-work"
    relationship: other
    note: >-
      Private canonical development from which the 39-file transitive proof
      closure was extracted at commit
      93ade4af0234cdd007215842f8b4fbbbb9535985. It is not a build dependency.

